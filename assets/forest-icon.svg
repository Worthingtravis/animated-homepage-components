<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2e"/>
      <stop offset="1" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3a8"/>
      <stop offset="1" stop-color="#3fa87a"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- trunk -->
  <rect x="121" y="150" width="14" height="58" rx="7" fill="#6b5a48"/>

  <!-- three tiers: a tree, its branches, its leaves -->
  <path d="M128 34 L182 106 H74 Z" fill="url(#leaf)"/>
  <path d="M128 78 L196 158 H60 Z" fill="url(#leaf)" opacity="0.92"/>
  <path d="M128 122 L210 206 H46 Z" fill="url(#leaf)" opacity="0.84"/>

  <!-- the three leaves, marking the variant axis -->
  <circle cx="86" cy="188" r="9" fill="#8b7bf0"/>
  <circle cx="128" cy="188" r="9" fill="#8b7bf0" opacity="0.62"/>
  <circle cx="170" cy="188" r="9" fill="#8b7bf0" opacity="0.34"/>
</svg>
